name: Real JDK runtime smoke

on:
  workflow_dispatch:

jobs:
  real-jdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm ARM64 runner
        if: matrix.os == 'macos-latest'
        run: test "$(uname -m)" = arm64
      - name: Install Java 17 for switching test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build jsh
        run: cargo build --release --locked
      - name: Download Java 21 and switch real JDKs
        shell: bash
        run: bash scripts/smoke-unix.sh
